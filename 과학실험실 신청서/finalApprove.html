  <script>
    'use strict';

    // 서버 템플릿에서 주입됨
    const templateId = <?!= jsonForScript_(id || '') ?>;
    const serverData = <?!= jsonForScript_(typeof appData === 'undefined' ? null : appData) ?>;
    const templateToken = <?!= jsonForScript_(typeof approvalToken === 'undefined' ? '' : approvalToken) ?>;

    // URL에서 id 파싱 (query, hash 모두 지원)
    function getIdFromLocation() {
      const qs = new URLSearchParams(location.search);
      const qid = (qs.get('id') || '').trim();
      const hs = new URLSearchParams(location.hash.replace(/^#/, ''));
      const hid = (hs.get('id') || '').trim();
      if (templateId && String(templateId).trim()) return String(templateId).trim();
      if (qid) return qid;
      if (hid) return hid;
      return '';
    }
    const appId = getIdFromLocation();

    // [v3.53] URL/템플릿에서 토큰 파싱 — 서버 호출 시 재검증용 (캐시 의존 제거)
    function getTokenFromLocation() {
      if (templateToken && String(templateToken).trim()) return String(templateToken).trim();
      const qs = new URLSearchParams(location.search);
      const qt = (qs.get('t') || '').trim();
      if (qt) return qt;
      const hs = new URLSearchParams(location.hash.replace(/^#/, ''));
      const ht = (hs.get('t') || '').trim();
      return ht || '';
    }
    const approvalToken = getTokenFromLocation();

    // ---- 유틸 ----
    function z(n){ return String(n).padStart(2,'0'); }
    function formatDateTime(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
      } catch(e){ return String(iso); }
    }
    function formatDateOnly(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
      } catch(e){ return String(iso); }
    }
    // Date/ISO/숫자/문자열 모두 HH:MM로 안전 변환
    function toLocalHHMM(val) {
      if (!val) return '';
      if (typeof val === 'string' && /^\d{1,2}:\d{2}$/.test(val)) return val; // 이미 HH:mm
      try {
        const d = (val instanceof Date) ? val : new Date(val);
        if (!isNaN(d.getTime())) return `${z(d.getHours())}:${z(d.getMinutes())}`;
      } catch(e){}
      // 숫자(시트 분수) 대응
      if (typeof val === 'number') {
        const mins = Math.round(val * 24 * 60);
        const hh = Math.floor(mins / 60) % 24;
        const mm = mins % 60;
        return `${z(hh)}:${z(mm)}`;
      }
      return String(val);
    }

    // ---- 경과시간 유틸 ----
    function elapsedText(isoDate) {
      if (!isoDate) return '';
      try {
        const submitted = new Date(isoDate);
        if (isNaN(submitted.getTime())) return '';
        const now = new Date();
        let diffMs = now - submitted;
        if (diffMs < 0) diffMs = 0;
        const diffMin = Math.floor(diffMs / 60000);
        const diffH = Math.floor(diffMin / 60);
        const diffD = Math.floor(diffH / 24);
        let text = '';
        let cls = 'urgent-low';
        if (diffD > 0) { text = diffD + '일 ' + (diffH % 24) + '시간 전'; }
        else if (diffH > 0) { text = diffH + '시간 ' + (diffMin % 60) + '분 전'; }
        else { text = diffMin + '분 전'; }
        if (diffH >= 24) cls = 'urgent-high';
        else if (diffH >= 6) cls = 'urgent-mid';
        return `<span class="elapsed ${cls}">(${text})</span>`;
      } catch(e){ return ''; }
    }

    function dDayText(isoDate) {
      if (!isoDate) return '';
      try {
        const target = new Date(isoDate);
        if (isNaN(target.getTime())) return '';
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const targetStart = new Date(target.getFullYear(), target.getMonth(), target.getDate());
        const diffDays = Math.round((targetStart - todayStart) / 86400000);
        let text = '';
        let cls = 'urgent-low';
        if (diffDays === 0) { text = 'D-Day'; cls = 'urgent-high'; }
        else if (diffDays > 0) { text = 'D-' + diffDays; }
        else { text = 'D+' + Math.abs(diffDays); cls = 'urgent-high'; }
        if (diffDays <= 1 && diffDays >= 0) cls = 'urgent-high';
        else if (diffDays <= 3) cls = 'urgent-mid';
        return `<span class="elapsed ${cls}">(${text})</span>`;
      } catch(e){ return ''; }
    }

    // ---- 아코디언 토글 ----
    function toggleAccordion(id, btn) {
      const el = document.getElementById(id);
      const arrow = btn.querySelector('.arrow');
      el.classList.toggle('open');
      const isOpen = el.classList.contains('open');
      arrow.textContent = isOpen ? '▼' : '▶';
      btn.setAttribute('aria-expanded', String(isOpen));
    }

    // ---- 유틸 ----
    function disableAllInputs_() {
      // [H1] accordion toggle과 overlay close 버튼은 살려둔다
      document.querySelectorAll(
        '#finalApproveForm input, #finalApproveForm textarea, #finalApproveForm select,' +
        ' #finalApproveForm button:not(.accordion-toggle):not(.chip):not(.overlay-close)'
      ).forEach(el => { el.disabled = true; });
    }

    function appendReason(text) {
      const ta = document.querySelector('.judgment-card textarea');
      if (ta) { ta.value = ta.value ? ta.value + ', ' + text : text; }
    }

    // ---- 렌더링 ----
    function fillForm(data) {
      // [H3] 이미 처리된 건이면 입력을 즉시 잠그고, 이벤트 리스너 부착도 건너뛴다
      const existingDecision = String(data['최종승인여부'] || '').trim();
      const alreadyProcessed = (existingDecision === '승인' || existingDecision === '반려');
      if (alreadyProcessed) {
        const banner = document.createElement('div');
        banner.className = 'already-processed';
        banner.textContent = '\u26a0\ufe0f 이미 최종 처리된 신청입니다 (' + existingDecision + ')';
        const form = document.getElementById('finalApproveForm');
        form.insertBefore(banner, form.querySelector('h2').nextSibling);
        const saveBtn = document.getElementById('saveBtn');
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.textContent = '\u2705 처리 완료 (' + existingDecision + ')';
        }
        // [H2] setTimeout 제거 — 즉시 잠금
        disableAllInputs_();
      }

      // 요약 카드
      document.getElementById('student').innerText     = `${data['대표자이름'] || ''} (${data['대표자학번'] || ''})`;
      document.getElementById('labTime').innerText     = `${data['신청실험실'] || ''} / ${data['신청시간'] || ''}`;
      document.getElementById('title').innerText       = data['실험제목'] || '';

      // 실험 날짜 + D-day
      if (data['실험할날짜']) {
        const dateStr = formatDateOnly(data['실험할날짜']);
        document.getElementById('appDateOnly').innerHTML = dateStr + dDayText(data['실험할날짜']);
      }

      // 상세 정보
      document.getElementById('appId').innerText       = data['신청ID'] || '';

      // 제출 일시 + 경과시간
      if (data['제출일시']) {
        const dtStr = formatDateTime(data['제출일시']);
        document.getElementById('submittedAt').innerHTML = dtStr + elapsedText(data['제출일시']);
      }

      document.getElementById('teamMembers').innerText = data['동반자명단'] || '';
      document.getElementById('totalParticipants').innerText = data['총인원수'] || '';
      document.getElementById('purpose').innerText     = data['사용목적'] || '';
      document.getElementById('advancedLab').innerText       = data['첨단기기실 이용 여부'] || '';
      document.getElementById('advancedLabReason').innerText = data['첨단기기실 이용 사유'] || '';
      document.getElementById('hoodUse').innerText          = data['후드 사용 여부'] || '';
      document.getElementById('hoodReason').innerText       = data['후드 사용 사유'] || '';
      document.getElementById('materials').innerText        = data['실험준비물'] || '';
      document.getElementById('process').innerText          = data['실험과정'] || '';
      document.getElementById('cleanup').innerText          = data['실험뒷정리'] || '';
      document.getElementById('precautions').innerText      = data['실험시 주의사항'] || '';
      document.getElementById('safety').innerText           = data['안전장구'] || '';
      document.getElementById('teacherName').innerText      = data['지도교사이름'] || '';
      document.getElementById('teacherEmail').innerText     = data['지도교사이메일'] || '';

      // 임장시간
      document.getElementById('fromTime').innerText = toLocalHHMM(data['임장지도 시작시간']);
      document.getElementById('toTime').innerText   = toLocalHHMM(data['임장지도 종료시간']);

      // ===== 신규 양식(IT실 / 가정실습실 / N동 공학 Zone) 처리 =====
      // 시트 '양식종류' 컬럼 값을 키로 카테고리(it/home/engineering) 식별.
      // 신규 양식이면 1층 전용 필드·시약 섹션·1차 승인 카드를 모두 숨기고 신규 섹션을 표시.
      var formCategoryRaw = String(data['양식종류'] || '').trim();
      // [2026-08] 판정은 서버가 한다 (Code.gs categoryFromSheetValue_).
      //   화면이 저장값 목록을 따로 들고 있으면 양식이 늘 때마다 조용히 옛 분기를 탄다.
      //   아래 map 은 서버 값이 없는 구버전 응답에 대한 폴백일 뿐이다.
      var newLabMap = {
        'IT실': 'it',
        '가정실습실': 'home',
        'N동 공학 ZONE': 'engineering',
        'N동 공학 Zone': 'engineering',
        'N동 공학 ZONE, Tech & Art LAB': 'engineering',
        'Tech & Art LAB': 'techart'
      };
      var newCat = String(data.__formCategory || '') || newLabMap[formCategoryRaw] || '';
      var isNewLab = !!newCat;

      if (isNewLab) {
        var legacy = document.getElementById('legacyExpFields');
        if (legacy) legacy.style.display = 'none';
        var legacyChem = document.getElementById('legacyChemBlock');
        if (legacyChem) legacyChem.style.display = 'none';
        // 임장지도 시간도 신규 양식에서는 미사용 → 빈 값 라벨이 보이지 않도록 함께 hide
        var visitBlock = document.getElementById('visitTimeBlock');
        if (visitBlock) visitBlock.style.display = 'none';

        var newSect = document.getElementById('newLabSection');
        if (newSect) newSect.style.display = '';

        document.getElementById('nlCategory').innerText      = formCategoryRaw;
        document.getElementById('nlLabRooms').innerText      = data['사용실험실목록'] || data['신청실험실'] || '';
        // 실습 주제는 Step 1 의 실험·실습 주제(=data['실험제목'])로 통합되어
        // 상단 요약 카드 #title 에 이미 표시됨. 별도 라벨 제거.
        document.getElementById('nlUsagePlan').innerText     = data['사용계획'] || '';

        if (newCat === 'it' || newCat === 'engineering') {
          document.getElementById('nlEquipmentBlock').style.display = '';
          document.getElementById('nlRequestedEquipment').innerText = data['신청장비'] || '';
        }

        if (newCat === 'it') {
          document.getElementById('nlItBlock').style.display = '';
          document.getElementById('nlComputerNumbers').innerText = data['사용컴퓨터번호'] || '';
          document.getElementById('nlSoldering').innerText       = data['납땜여부'] || '';
        }

        if (newCat === 'home') {
          document.getElementById('nlHomeBlock').style.display = '';
          document.getElementById('nlDangerousTools').innerText = data['위험도구'] || '';
          var matBody = document.getElementById('nlMaterialsBody');
          matBody.innerHTML = '';
          var materials = [];
          try { materials = JSON.parse(data['재료JSON'] || '[]'); }
          catch (_) { materials = []; }
          materials.forEach(function(m) {
            var tr = document.createElement('tr');
            ['name','qty','disposal'].forEach(function(k) {
              var td = document.createElement('td');
              td.style.padding = '6px 8px';
              td.style.border  = '1px solid #ddd';
              td.innerText = (m && m[k]) || '';
              tr.appendChild(td);
            });
            matBody.appendChild(tr);
          });
        }

        if (newCat === 'home' || newCat === 'engineering') {
          document.getElementById('nlEduBlock').style.display = '';
          document.getElementById('nlEduEquipment').innerText = data['교육_장비사용법'] || '';
          document.getElementById('nlEduCleanup').innerText   = data['교육_정리방법']   || '';
        }

        // 신규 양식은 1차 승인 단계가 없으므로 1차 승인 결과 카드도 숨김
        var firstCardNL = document.getElementById('firstApprovalCard');
        if (firstCardNL) firstCardNL.style.display = 'none';
      }

      // 시약목록
      const tbody = document.querySelector('#chemicalTable tbody');
      tbody.innerHTML = '';
      let dangerCount = 0;
      (data.chemicals || []).forEach(c => {
        const tr = document.createElement('tr');
        const isDanger = String(c['교사임장여부'] || '').trim() === '필요';
        if (isDanger) {
          tr.classList.add('chem-danger');
          dangerCount++;
        }
        ['시약명','상태','농도','용량','MSDS','교사임장여부'].forEach(k => {
          const td = document.createElement('td');
          td.innerText = c[k] || '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      // 시약 배지
      const chemBadge = document.getElementById('chemBadge');
      const totalChem = (data.chemicals || []).length;
      if (dangerCount > 0) {
        chemBadge.innerHTML = `<span style="background:#dc2626;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;">위험 ${dangerCount}건</span>`;
      } else if (totalChem > 0) {
        chemBadge.innerHTML = `<span style="background:#6b7280;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;">${totalChem}건</span>`;
      }

      // [H3] 이미 처리된 건이면 이벤트 리스너 부착 생략
      if (!alreadyProcessed) {
        document.getElementsByName('decision').forEach(r => { r.onchange = toggleComment; });
      }

      // Show 1st approval results
      const firstCard = document.getElementById('firstApprovalCard');
      if (firstCard) {
        const firstApproval = data['지도승인여부'] || data['1차승인결과'] || '';
        if (firstApproval) {
          firstCard.style.display = 'block';
          document.getElementById('firstApprover').textContent = data['지도교사이름'] || data['지도교사'] || data['1차승인교사'] || '-';
          document.getElementById('firstResult').textContent = firstApproval;
          // [기능 변경] '승인 시간' 항목 제거됨 — DOM 자체 제거되어 JS 채우기 코드도 삭제
          // [검토반영] 시트/서버 실제 키는 '지도승인의견' (Code.js submitApproval_ 저장 키).
          //   기존 두 키는 존재하지 않아 1차 의견이 항상 '-'로 표시됐음.
          document.getElementById('firstComment').textContent =
            data['지도승인의견'] || data['지도교사의견'] || data['1차승인의견'] || '-';
        }
      }

      // 처리 완료 상태를 한 번 더 강제 적용 (렌더링 후 입력 enable 방지)
      if (alreadyProcessed) {
        disableAllInputs_();
      }
    }

    function toggleComment() {
      const decision = document.querySelector('input[name="decision"]:checked');
      const commentDiv = document.getElementById('commentDiv');
      const commentLabel = document.getElementById('commentLabel');
      const comment = document.getElementById('comment');
      if (!decision) { commentDiv.classList.add('hidden'); return; }
      commentDiv.classList.remove('hidden');
      if (decision.value === '반려') {
        commentLabel.textContent = '반려 사유';
        comment.placeholder = '반려 사유를 입력하세요.';
      } else {
        commentLabel.textContent = '승인 의견 (선택)';
        comment.placeholder = '학생에게 전달할 의견이 있으면 입력하세요.';
      }
    }

    // ---- 로드 흐름 (SSR 우선, 폴백은 클라이언트 호출) ----
    // [v3.58 / 6-3] 데이터를 못 불러온 상태에서 깜깜이 승인을 막음 — 저장 버튼 잠금
    function lockForLoadError_() {
      try {
        const btn = document.getElementById('saveBtn');
        if (btn) { btn.disabled = true; btn.textContent = '데이터 로딩 실패 — 저장 불가'; }
      } catch (_) {}
    }

    // [v3.58 / 6-5] 같은 시간대 기승인 경고 배너
    function showCapacityWarning_(data) {
      try {
        if (!data || !data.__sameSlotApproved) return;
        if (document.getElementById('__capacityWarn__')) return;
        const el = document.createElement('div');
        el.id = '__capacityWarn__';
        el.style.cssText = 'margin:12px 0;padding:12px 16px;border-radius:8px;background:#fef3c7;border-left:4px solid #f59e0b;color:#92400e;font-size:14px;line-height:1.6;';
        el.innerHTML = '⚠️ <b>같은 날짜·실험실·시간대에 이미 최종 승인된 신청이 ' +
          data.__sameSlotApproved + '건 있습니다.</b>' +
          (data.__sameSlotApprovedDetail ? '<br>기승인: ' + data.__sameSlotApprovedDetail : '') +
          '<br>공간·지도 인원이 겹쳐도 괜찮은지 확인 후 처리해 주세요.';
        const status = document.getElementById('statusMsg');
        if (status && status.parentNode) status.parentNode.insertBefore(el, status);
        else document.body.insertBefore(el, document.body.firstChild);
      } catch (_) {}
    }

    function loadData() {
      const status = document.getElementById('statusMsg');

      if (serverData && !serverData.__error) {
        fillForm(serverData);
        showCapacityWarning_(serverData);
        status.innerText = '';
        return;
      }
      if (serverData && serverData.__error) {
        alert('데이터 로딩 오류: ' + serverData.__error);
        status.innerText = '로딩 실패: ' + serverData.__error;
        lockForLoadError_();
        return;
      }
      if (!appId) {
        alert('신청 ID가 제공되지 않았습니다.');
        status.innerText = '신청 ID가 없습니다.';
        lockForLoadError_();
        return;
      }

      status.innerText = '데이터 로딩 중...';
      google.script.run
        .withSuccessHandler(data => {
          if (!data) {
            alert('신청 데이터를 찾을 수 없습니다.');
            status.innerText = '데이터 없음';
            lockForLoadError_();
            return;
          }
          fillForm(data);
          showCapacityWarning_(data);
          status.innerText = '';
        })
        .withFailureHandler(err => {
          alert('로딩 오류: ' + (err.message || err));
          status.innerText = '로딩 실패: ' + (err.message || err);
          lockForLoadError_();
        })
        .getApplication(appId, approvalToken);  // [v3.53] 토큰 전달 → 서버 재검증
    }

    // ===== 전체화면 상태 오버레이 제어 =====
    // state: 'loading' | 'success' | 'warning' | 'error'
    function showStatusOverlay(state, title, sub) {
      const overlay = document.getElementById('statusOverlay');
      const visual  = document.getElementById('overlayVisual');
      const tEl     = document.getElementById('overlayTitle');
      const sEl     = document.getElementById('overlaySub');
      const closeBtn = document.getElementById('overlayCloseBtn');
      if (!overlay) return;

      // [v3.58 / 6-4] 로딩 30초 초과 시 닫기 버튼 노출 — 영구 스피너 방지
      if (window.__overlayTimeout__) { clearTimeout(window.__overlayTimeout__); window.__overlayTimeout__ = null; }
      if (state === 'loading') {
        visual.innerHTML = '<div class="spinner" aria-hidden="true"></div>';
        tEl.textContent  = title || '저장 중입니다';
        sEl.textContent  = sub   || '잠시만 기다려주세요…';
        closeBtn.classList.add('hidden');
        window.__overlayTimeout__ = setTimeout(function() {
          try {
            sEl.textContent = '응답이 지연되고 있습니다. 잠시 후 페이지를 새로고침해 처리 상태를 확인해 주세요.\n(이미 저장됐다면 "이미 처리된 신청" 안내가 표시됩니다.)';
            closeBtn.classList.remove('hidden');
          } catch (_) {}
        }, 30000);
      } else if (state === 'success') {
        visual.innerHTML = '<div class="icon-big icon-success" aria-hidden="true">✓</div>';
        tEl.textContent  = title || '저장되었습니다';
        sEl.textContent  = sub   || '처리가 완료되었습니다.';
        closeBtn.classList.add('hidden');
      } else if (state === 'warning') {
        visual.innerHTML = '<div class="icon-big icon-warning" aria-hidden="true">!</div>';
        tEl.textContent  = title || '저장되었으나 수동 조치가 필요합니다';
        sEl.textContent  = sub   || '학과 사무실에서 직접 연락해 주세요.';
        closeBtn.classList.remove('hidden');
      } else if (state === 'error') {
        visual.innerHTML = '<div class="icon-big icon-error" aria-hidden="true">!</div>';
        tEl.textContent  = title || '오류가 발생했습니다';
        sEl.textContent  = sub   || '다시 시도해 주세요.';
        closeBtn.classList.remove('hidden');
      }
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function hideStatusOverlay() {
      const overlay = document.getElementById('statusOverlay');
      if (!overlay) return;
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    function submitFinalApproval() {
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('statusMsg');
      const decision = document.querySelector('input[name="decision"]:checked')?.value;
      const comment  = document.getElementById('comment').value.trim();

      if (!decision) { alert('최종 승인/반려를 선택하세요.'); return; }
      if (decision === '반려' && !comment) { alert('반려 사유를 입력하세요.'); return; }

      const confirmMsg = decision === '승인'
        ? '최종 승인 처리하시겠습니까?\n학생에게 최종 승인 안내 메일이 발송됩니다.'
        : '최종 반려 처리하시겠습니까?\n학생에게 반려 안내 메일이 발송됩니다.\n\n반려 사유: ' + comment;
      if (!confirm(confirmMsg)) {
        // confirm 취소 시 상태 완전 복구
        btn.disabled = false;
        btn.textContent = '저장하기';
        status.innerText = '';
        return;
      }

      btn.disabled = true;
      btn.textContent = '저장 중…';
      status.innerText = '';
      showStatusOverlay('loading', '저장 중입니다', '잠시만 기다려주세요…');

      google.script.run
        .withSuccessHandler(msg => {
          // [C4] 서버 prefix 감지 — 수동 조치가 필요한 경우 노란 경고
          const text = String(msg || '');
          const needsManual = /^\[수동조치필요\]/.test(text) || text.indexOf('⚠️') !== -1;
          const cleaned = text.replace(/^\[수동조치필요\]\s*/, '');
          const firstLine = cleaned.split('\n')[0].trim();
          const restLines = cleaned.split('\n').slice(1).join('\n').trim();

          btn.disabled = true;
          btn.textContent = '\u2705 처리 완료';
          disableAllInputs_();
          status.innerText = text;

          if (needsManual) {
            showStatusOverlay(
              'warning',
              '저장되었습니다 · 수동 조치 필요',
              (restLines || firstLine) + '\n\n학과 사무실에서 확인 후 직접 연락해 주세요.'
            );
          } else {
            const subText = decision === '승인' ? '최종 승인 처리가 완료되었습니다.' : '최종 반려 처리가 완료되었습니다.';
            showStatusOverlay('success', '저장되었습니다', subText);
            setTimeout(hideStatusOverlay, 2500);
          }
        })
        .withFailureHandler(e => {
          const errMsg = (e && (e.message || e.toString())) || '알 수 없는 오류';
          showStatusOverlay('error', '오류가 발생했습니다', errMsg);
          status.innerText = '오류: ' + errMsg;
          btn.disabled = false;
          btn.textContent = '저장하기';
        })
        .submitFinalApproval({ id: appId, decision, comment, token: approvalToken });  // [v3.53] 토큰 전달
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadData);
    } else {
      setTimeout(loadData, 50);
    }
  </script>
</body>
</html>
