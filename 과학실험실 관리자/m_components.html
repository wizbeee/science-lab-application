<!-- ===== 목업 동일: 햄버거 메뉴 (mobile_hamburger.html) ===== -->
<div class="overlay" role="presentation" aria-hidden="true" onclick="closeMenu()"></div>
<nav class="slide-menu" role="navigation" aria-label="메인 메뉴">
  <div class="menu-header">
    <div class="menu-title">과학 실험·실습실</div>
    <div class="menu-subtitle">관리 시스템 v4.0</div>
    <div class="menu-user">
      <div class="user-avatar" id="menu-user-avatar" aria-hidden="true">T</div>
      <div class="user-info">
        <div class="user-name" id="menu-user-name">선생님</div>
        <div class="user-role" id="menu-user-role">담당</div>
      </div>
    </div>
  </div>
  <div class="menu-nav">
    <div class="menu-section-title" aria-hidden="true">메뉴</div>
    <button class="menu-item" data-view="admin" aria-label="대시보드로 이동" onclick="closeMenu(); mGoToPage('admin');">
      대시보드
      <span class="badge" id="menu-pending-badge" aria-label="대기중 신청" style="display:none">0</span>
    </button>
    <button class="menu-item" data-view="common_list" aria-label="시약 목록으로 이동" onclick="closeMenu(); mGoToPage('common_list');">
      시약 목록
    </button>
    <button class="menu-item" data-view="student_list" aria-label="학생 명단으로 이동" onclick="closeMenu(); mGoToPage('student_list');">
      학생 명단
    </button>
    <button class="menu-item" data-view="teacher_schedule" aria-label="임장 일정으로 이동" onclick="closeMenu(); mGoToPage('teacher_schedule');">
      임장
    </button>
    <div class="menu-divider" aria-hidden="true"></div>
    <div class="menu-section-title" aria-hidden="true">관리</div>
    <!-- [v4.18/S3] 출석체크 -->
    <button class="menu-item" aria-label="오늘의 실험실 출석체크 열기" onclick="closeMenu(); if(typeof openTodayLab==='function') openTodayLab();">
      오늘의 실험실 (출석)
    </button>
    <button class="menu-item" aria-label="지도일지 작성 열기" onclick="closeMenu(); if(typeof openGuidanceModal==='function') openGuidanceModal();">
      지도일지 작성
    </button>
    <button class="menu-item" aria-label="지도 통계 열기" onclick="closeMenu(); if(typeof openWarningStats==='function') openWarningStats();">
      지도 통계
    </button>
    <button class="menu-item" aria-label="신청 제한 관리 열기" onclick="closeMenu(); if(typeof openRestrictionModal==='function') openRestrictionModal();">
      신청 제한 관리
    </button>
  </div>
  <div class="menu-footer">
    <button class="menu-footer-item" aria-label="다크모드 토글" onclick="toggleDarkMode();">
      <span><span class="icon" aria-hidden="true">🌙</span> 다크모드</span>
      <div class="toggle" id="dark-toggle" aria-hidden="true"></div>
    </button>
    <button class="menu-footer-item" aria-label="페이지 새로고침" onclick="closeMenu(); location.reload();">
      <span><span class="icon" aria-hidden="true">↻</span> 새로고침</span>
    </button>
    <!-- [v3.38] 멀티 로그인 환경에서 다른 Google 계정으로 즉시 전환 -->
    <button class="menu-footer-item" style="color:#b45309;" aria-label="다른 Google 계정으로 변경" onclick="closeMenu(); mSwitchAccount();">
      <span><span class="icon" aria-hidden="true">🔄</span> 다른 계정</span>
    </button>
    <!-- [v4.18/S2] PC 화면 전환 — 선택은 기기에 기억됨 -->
    <button class="menu-footer-item" aria-label="PC 화면으로 전환" onclick="closeMenu(); mSwitchPlatform('desktop');">
      <span><span class="icon" aria-hidden="true">🖥️</span> PC 화면으로</span>
    </button>
    <button class="menu-footer-item" style="color:var(--danger);" aria-label="로그아웃" onclick="closeMenu(); mGoToPage('logout');">
      <span>로그아웃</span>
    </button>
  </div>

  <script>
    // [v3.38] 모바일: 다른 Google 계정으로 변경 — AccountChooser로 이동
    function mSwitchAccount() {
      var base = (typeof APP_BASE_URL !== 'undefined' && APP_BASE_URL) ? APP_BASE_URL : window.location.origin;
      var chooserUrl = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(base);
      window.top.location.href = chooserUrl;
    }
    // [v4.18/S2] 모바일 → PC 화면 전환 — 선택을 이 기기(localStorage)에 기억
    function mSwitchPlatform(target) {
      try { localStorage.setItem('lab-admin-platform-pref', target); } catch (e) {}
      var base = (typeof APP_BASE_URL !== 'undefined' && APP_BASE_URL) ? APP_BASE_URL : '';
      if (!base) return;
      window.top.location.href = (target === 'desktop') ? (base + '?view=admin&platform=desktop') : (base + '?platform=mobile');
    }
  </script>
  <div class="version" aria-hidden="true">v4.0 · 2026</div>
</nav>

<!-- ===== 목업 동일: 하단 네비게이션 (mobile_dashboard.html) ===== -->
<nav class="bottom-nav" role="navigation" aria-label="탭 네비게이션">
  <button class="nav-item" data-view="admin" onclick="mGoToPage('admin');">
    대시보드
  </button>
  <button class="nav-item" data-view="common_list" onclick="mGoToPage('common_list');">
    시약
  </button>
  <button class="nav-item" data-view="student_list" onclick="mGoToPage('student_list');">
    학생
  </button>
  <button class="nav-item" data-view="teacher_schedule" onclick="mGoToPage('teacher_schedule');">
    임장
  </button>
</nav>

<script>
// [v4.18/S6] 메뉴 사용자 정보 실데이터 표시 — 고정 플레이스홀더("선생님/담당/T") 대체
(function(){
  try {
    var s = sessionStorage.getItem('__lab_admin_session__');
    if (!s) return;
    var o = JSON.parse(s);
    if (!o || !o.displayName) return;
    var nm = String(o.displayName);
    var n = document.getElementById('menu-user-name');
    if (n) n.textContent = o.role === 'admin' ? nm : (nm + ' 선생님');
    var r = document.getElementById('menu-user-role');
    if (r) r.textContent = o.role === 'admin' ? '학과 관리자' : '교사';
    var a = document.getElementById('menu-user-avatar');
    if (a && nm.charAt(0)) a.textContent = nm.charAt(0);
  } catch (e) {}
})();

function setActiveNav(viewName) {
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === viewName));
  $$('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.view === viewName));
}
function updatePendingBadge(count) {
  const badge = $('#menu-pending-badge');
  if (badge) { badge.textContent = count; badge.style.display = count > 0 ? '' : 'none'; }
}
</script>
