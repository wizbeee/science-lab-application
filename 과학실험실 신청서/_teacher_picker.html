<!--
  ================================================================
  공용 지도교사 선택기 (2026-08)
  ----------------------------------------------------------------
  모든 신청 폼(1층·2층·IT·가정·공학·Tech & Art)이 이 파일 하나만 사용한다.

  이전에는 "어떤 과목 교사가 어떤 실습실을 지도할 수 있는가"를 각 폼 HTML이
  제각각 하드코딩했다. 1·2층은 과목 완전일치(===), 신규 폼은 부분일치라
  과목이 '물리(테크)'인 선생님이 2층 폼에서만 사라지는 문제가 있었다.

  이제 판단은 전부 서버의 LAB_APPROVAL_POLICY_ 가 하고, 화면은 결과만 그린다.
  폼에서 규칙을 고칠 일이 없으므로 폼마다 규칙이 어긋나는 일도 없다.
  ================================================================
-->
<script>
(function () {
  'use strict';

  /**
   * 선택한 실습실·사용목적에 맞는 지도교사 목록을 서버에서 받아 <select>를 채운다.
   *
   * @param {Object} opts
   *   selectId    {string}   지도교사 <select> 요소 id (기본 'teacher')
   *   emailId     {string}   지도교사 이메일 hidden input id (없으면 생략)
   *   hintId      {string}   안내 문구를 표시할 요소 id (없으면 생략)
   *   labs        {string[]} 선택된 실습실 이름 배열
   *   purpose     {string}   사용목적 (1층 동아리 분기에만 사용)
   *   showSubject {boolean}  옵션 텍스트에 과목을 함께 표기할지
   *   onLoaded    {function} 목록 반영 후 콜백(list)
   */
  window.loadEligibleTeachers = function (opts) {
    opts = opts || {};
    var sel = document.getElementById(opts.selectId || 'teacher');
    if (!sel) return;
    var hint = opts.hintId ? document.getElementById(opts.hintId) : null;
    var emailEl = opts.emailId ? document.getElementById(opts.emailId) : null;
    var labs = (opts.labs || []).filter(Boolean);

    var setHint = function (msg, isError) {
      if (!hint) return;
      hint.textContent = msg || '';
      hint.style.display = msg ? '' : 'none';
      hint.style.color = isError ? '#b91c1c' : '';
    };

    var fill = function (list, hintMsg, isError) {
      var prev = sel.value;
      sel.innerHTML = '<option value="">선택</option>';
      (list || []).forEach(function (t) {
        var o = document.createElement('option');
        o.value = t.name;
        o.textContent = opts.showSubject && t.subject ? (t.name + ' (' + t.subject + ')') : t.name;
        o.dataset.email = t.email || '';
        sel.appendChild(o);
      });
      // 실습실을 다시 골라도 이미 고른 지도교사가 여전히 자격이 있으면 유지
      if (prev) {
        sel.value = prev;
        if (sel.value !== prev) sel.selectedIndex = 0;
      }
      // 임시저장 불러오기가 목록 로드보다 먼저 끝난 경우 재적용
      if (window.__pendingTeacher__) {
        sel.value = window.__pendingTeacher__;
        if (sel.value) window.__pendingTeacher__ = null;
      }
      if (emailEl) {
        var opt = sel.selectedOptions && sel.selectedOptions[0];
        emailEl.value = (opt && opt.dataset.email) || '';
      }
      setHint(hintMsg, isError);
      if (typeof opts.onLoaded === 'function') opts.onLoaded(list || []);
    };

    // 실습실 미선택 → 빈 목록 (어떤 자격이 필요한지 아직 알 수 없음)
    if (!labs.length) {
      fill([], '실습실을 먼저 선택하면 지도교사 목록이 표시됩니다.', false);
      return;
    }

    sel.innerHTML = '<option value="">불러오는 중…</option>';
    setHint('', false);

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          fill([], (res && res.message) || '지도교사 목록을 불러오지 못했습니다.', true);
          return;
        }
        fill(res.teachers, res.message || '', !res.teachers.length);
      })
      .withFailureHandler(function (err) {
        fill([], '지도교사 목록을 불러오지 못했습니다: ' +
          ((err && (err.message || err)) || '알 수 없는 오류'), true);
      })
      .getEligibleTeachers(labs, opts.purpose || '');
  };

  /** 지도교사 <select> 변경 시 이메일 hidden 값을 함께 갱신 */
  window.bindTeacherEmailSync = function (selectId, emailId) {
    var sel = document.getElementById(selectId || 'teacher');
    var emailEl = document.getElementById(emailId || 'teacherEmail');
    if (!sel || !emailEl) return;
    sel.addEventListener('change', function () {
      var opt = sel.selectedOptions && sel.selectedOptions[0];
      emailEl.value = (opt && opt.dataset.email) || '';
    });
  };
})();
</script>
