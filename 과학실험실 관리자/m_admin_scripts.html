<script>
/* =========================================================
 * 모바일 대시보드 스크립트 — 목업 클래스명 동일 버전
 * ========================================================= */

let ALL = [];
let VIEW = [];
let STATUS_FILTER = '';
const PAGE = { current: 1, size: 20 };
let CURRENT_DETAIL = null;

const mFilters = {
  basis: '실험할날짜', dateFrom: '', dateTo: '',
  lab: '', status: '', search: ''
};

/* ===== 데이터 로딩 ===== */
// [MR21/MR22] 로딩 중 버튼 비활성화 + 실패 시 재시도 버튼
var LOADING = false;
function _setLoadingUIEnabled_(disabled) {
  // [v4.18/S6] 대시보드 뷰로 스코프 한정 (재부모화된 모달·다른 뷰 버튼 오염 방지)
  var ids = ['#labSelect','#statusSelect','#searchInput','#view-admin .filter-search-btn','#view-admin .quick-btn'];
  ids.forEach(function(sel){
    document.querySelectorAll(sel).forEach(function(el){
      el.disabled = disabled;
      if (disabled) el.setAttribute('aria-busy', 'true'); else el.removeAttribute('aria-busy');
    });
  });
}
// [v4.0.10/UX-38] 풀-투-리프레시 비활성 안내 — 첫 진입 1회만 (localStorage 표시)
(function showPtrNoticeOnce(){
  try {
    if (localStorage.getItem('m-ptr-notice-shown') === '1') return;
    setTimeout(function(){
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;';
      box.innerHTML = '아래로 당겨도 새로고침이 되지 않습니다.<br>우측 상단 ↻ 버튼을 사용하세요.';
      document.body.appendChild(box);
      setTimeout(function(){ if (box.parentNode) box.parentNode.removeChild(box); }, 4500);
      localStorage.setItem('m-ptr-notice-shown', '1');
    }, 1500);
  } catch (_) {}
})();

function loadApplications() {
  if (LOADING) return;           // 중복 호출 방지
  LOADING = true;
  _setLoadingUIEnabled_(true);

  mFilters.lab = $('#labSelect') ? $('#labSelect').value || '' : '';
  mFilters.status = $('#statusSelect') ? $('#statusSelect').value || '' : '';
  mFilters.search = $('#searchInput') ? $('#searchInput').value.trim() : '';

  $('#card-list').innerHTML = '<div class="m-loading"><div class="m-loading-spinner"></div><span>데이터를 불러오는 중...</span></div>';

  google.script.run
    .withSuccessHandler(function(list) {
      LOADING = false;
      _setLoadingUIEnabled_(false);
      ALL = Array.isArray(list) ? list : [];
      applyStats();
      PAGE.current = 1;
      refreshView();
    })
    .withFailureHandler(function(err) {
      LOADING = false;
      _setLoadingUIEnabled_(false);
      // [MR22] 재시도 버튼 제공
      var msg = (err && (err.message || err)) || '알 수 없는 오류';
      $('#card-list').innerHTML =
        '<div class="m-empty">' +
        '<div>오류: ' + escapeHtml(msg) + '</div>' +
        '<button type="button" class="m-retry-btn" onclick="loadApplications()" ' +
        'style="margin-top:12px;padding:10px 20px;background:var(--primary,#2563eb);color:#fff;border:0;border-radius:8px;font-size:14px;min-height:44px;">다시 시도</button>' +
        '</div>';
    })
    .getAllApplications({
      dateFrom: mFilters.dateFrom, dateTo: mFilters.dateTo,
      lab: mFilters.lab, status: mFilters.status,
      searchTerm: mFilters.search, basis: mFilters.basis,
      includeChemicals: false  // ✅ 대시보드 목록에서는 시약 데이터 불필요
    });
}

/* ===== 통계 ===== */
function applyStats() {
  var pending = 0, first = 0, final_ = 0, rejected = 0;
  ALL.forEach(function(app) {
    var st = calcStatus(app);
    if (st === '대기') pending++;
    else if (st === '1차승인') first++;
    else if (st === '최종승인') final_++;
    else if (st === '반려') rejected++;
  });
  $('#stat-total').textContent = ALL.length;
  $('#stat-pending').textContent = pending;
  $('#stat-first').textContent = first;
  $('#stat-final').textContent = final_;
  $('#stat-rejected').textContent = rejected;
  updatePendingBadge(pending);
}

/* ===== 필터/정렬 → 뷰 갱신 ===== */
function refreshView() {
  var rows = ALL.slice();
  if (STATUS_FILTER) rows = rows.filter(function(a) { return calcStatus(a) === STATUS_FILTER; });
  if (mFilters.status) rows = rows.filter(function(a) { return calcStatus(a) === mFilters.status; });
  // [v2] 신규 양식 '사용실험실목록'(콤마결합)에도 매칭
  if (mFilters.lab) {
    var labQ = String(mFilters.lab);
    rows = rows.filter(function(a) {
      if (String(a['신청실험실'] || '') === labQ) return true;
      var list = String(a['사용실험실목록'] || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
      return list.indexOf(labQ) >= 0;
    });
  }
  if (mFilters.search) {
    var t = mFilters.search.toLowerCase();
    rows = rows.filter(function(a) {
      return String(a['대표자학번']||'').toLowerCase().includes(t) ||
        String(a['대표자이름']||'').toLowerCase().includes(t) ||
        String(a['지도교사이름']||'').toLowerCase().includes(t) ||
        String(a['실험제목']||'').toLowerCase().includes(t) ||
        labelOfFormCategory(a).toLowerCase().includes(t); // [v2] 양식 한글 라벨
    });
  }
  rows.sort(function(a, b) { return cmpDateTs(b['실험할날짜'], a['실험할날짜']); });
  VIEW = rows;
  renderCards();
}

/* ===== 카드 렌더링 — 목업 HTML과 동일 구조 ===== */
function renderCards() {
  var container = $('#card-list');
  var total = VIEW.length;
  var end = PAGE.current * PAGE.size;
  var showing = VIEW.slice(0, end);
  var remaining = total - end;

  var countEl = $('#result-count');
  if (countEl) {
    if (total === 0) countEl.textContent = '조건에 맞는 신청이 없습니다';
    else countEl.innerHTML = '총 <strong>' + total + '건</strong>' + (remaining > 0 ? ' 중 <strong>' + showing.length + '건</strong> 표시' : '');
  }

  if (total === 0) {
    container.innerHTML = '<div class="m-empty"><div>조건에 맞는 신청이 없습니다</div></div>';
    return;
  }

  var html = '';
  showing.forEach(function(app) {
    var status = calcStatus(app);
    var appId = escapeHtml(app['신청ID'] || '');
    var name = escapeHtml(app['대표자이름'] || '');
    var stuId = escapeHtml(app['대표자학번'] || '');
    var lab = escapeHtml(app['신청실험실'] || '');
    var date = fmtDate(app['실험할날짜']);
    var time = escapeHtml(app['신청시간'] || '');
    var title = escapeHtml(app['실험제목'] || '');
    var teacher = escapeHtml(app['지도교사이름'] || '');
    var badgeClass = statusBadgeClass(status);
    var dataStatus = statusDataAttr(status);

    var approveBtn = '';
    if (status === '대기') {
      approveBtn = '<button class="card-btn card-btn-approve-menu" onclick="event.stopPropagation(); quickApprove(\'' + appId + '\')">승인 처리 ▾</button>';
    } else if (status === '1차승인') {
      approveBtn = '<button class="card-btn card-btn-approve-menu" onclick="event.stopPropagation(); quickFinalApprove(\'' + appId + '\')">최종승인 ▾</button>';
    } else if (status === '반려') {
      approveBtn = '<button class="card-btn" style="background:#fee2e2;color:#991b1b;" onclick="event.stopPropagation(); openDetail(\'' + appId + '\')">반려 사유</button>';
    } else {
      approveBtn = '<button class="card-btn" style="background:var(--bg);color:var(--text-muted);">완료됨</button>';
    }

    // [v4.0.10/UX-20] 모바일 카드 좌→우 스와이프=승인, 우→좌=반려 (touchstart/touchend)
    html += '<div class="app-card" data-status="' + dataStatus + '" data-app-id="' + appId + '" ' +
      'ontouchstart="(function(e,el){el.dataset._tx=e.touches[0].clientX;el.dataset._ty=e.touches[0].clientY;})(event,this)" ' +
      'ontouchend="(function(e,el){var sx=parseFloat(el.dataset._tx||0),sy=parseFloat(el.dataset._ty||0);var ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY;var dx=ex-sx,dy=ey-sy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2){var id=el.dataset.appId;if(dx>0){if(typeof quickApprove===\'function\')quickApprove(id);}else{if(typeof mSwipeReject===\'function\')mSwipeReject(id);else openDetail(id);}}})(event,this)" ' +
      'onclick="openDetail(\'' + appId + '\')">' +
      '<div class="card-header">' +
        '<div><span class="card-student">' + name + '</span><span class="card-student-id">' + stuId + '</span></div>' +
        '<span class="status-badge ' + badgeClass + '">' + status + '</span>' +
      '</div>' +
      '<div class="card-info">' +
        '<span class="card-info-item">' + mLabBadge(app) + lab + '</span>' +
        '<span class="card-info-item">' + date + '</span>' +
        '<span class="card-info-item">' + time + '</span>' +
        '<span class="card-info-item">' + teacher + '</span>' +
      '</div>' +
      '<div class="card-title">' + title + '</div>' +
      '<div class="card-actions">' +
        '<button class="card-btn card-btn-detail" onclick="event.stopPropagation(); openDetail(\'' + appId + '\')">상세 보기</button>' +
        approveBtn +
      '</div>' +
    '</div>';
  });

  if (remaining > 0) {
    html += '<div class="load-more"><button class="load-more-btn" onclick="loadMore()">더보기 (' + remaining + '건 남음) ↓</button></div>';
  }
  container.innerHTML = html;
}

function loadMore() { PAGE.current++; renderCards(); }

/* ===== 상세보기 — 목업 mobile_detail.html과 동일 구조 ===== */
function openDetail(id) {
  var app = ALL.find(function(a) { return String(a['신청ID']) === String(id); });
  if (!app) { alert('신청 데이터를 찾을 수 없습니다.'); return; }
  CURRENT_DETAIL = app;
  // [v4.0.10/UX-35] 진동 피드백 (Android — 사용자 옵션 미구현, 짧게 20ms)
  try { if (navigator.vibrate) navigator.vibrate(20); } catch (_) {}
  var status = calcStatus(app);

  // 상태 배너
  var statusEl = $('#detail-status');
  var statusClassMap = { '대기': 'pending', '1차승인': 'first', '최종승인': 'final', '반려': 'rejected' };
  statusEl.className = 'status-banner ' + (statusClassMap[status] || '');
  statusEl.textContent = status + (status === '대기' ? ' — 승인 대기 중' : '');

  // 상세 내용 — section/info-row 구조 (목업 동일)
  var body = $('#detail-body');
  var h = '<div class="section"><div class="section-title">기본 정보</div><div class="info-grid">' +
    ir('신청번호', '#' + escapeHtml(app['신청ID']||'')) +
    ir('대표자', escapeHtml(app['대표자이름']||'') + ' (' + escapeHtml(app['대표자학번']||'') + ')') +
    ir('실험·실습실', mLabBadge(app) + escapeHtml(app['신청실험실']||'')) +
    ir('실험날짜', fmtDate(app['실험할날짜'])) +
    ir('시간', escapeHtml(app['신청시간']||'')) +
    ir('실험제목', escapeHtml(app['실험제목']||'')) +
    ir('지도교사', escapeHtml(app['지도교사이름']||'')) +
    ir('제출일시', fmtDate(app['제출일시'], true)) +
    ir('총인원', escapeHtml(app['총인원수']||'')) +
    ir('사용목적', escapeHtml(app['사용목적']||'') + (app['사용목적 기타'] ? ' <span style="color:var(--text-muted)">(' + escapeHtml(app['사용목적 기타']) + ')</span>' : '')) +
    ((app['임장지도 시작시간'] || app['임장지도 종료시간']) ? ir('임장지도 시간', escapeHtml(app['임장지도 시작시간']||'-') + ' ~ ' + escapeHtml(app['임장지도 종료시간']||'-')) : '') +
    (app['안전장구'] ? ir('안전장구', escapeHtml(app['안전장구'])) : '') +
  '</div></div>';

  // [G+] 승인 검토 섹션 — 데스크탑 admin_scripts.html 과 동일 항목 노출
  //   1차/최종 승인 결과·의견 + 1차 검토(P0-2: 도구장비/실험내용 적절성)
  if (app['지도승인여부'] || app['지도승인의견'] || app['최종승인여부'] || app['최종승인의견'] || app['도구장비_적절성'] || app['실험내용_적절성']) {
    // [기능 변경] 승인이면 '승인 의견', 반려면 '반려 사유'로 동적 라벨
    var _s1 = String(app['지도승인여부']||'').trim();
    var _sf = String(app['최종승인여부']||'').trim();
    h += '<div class="section"><div class="section-title">승인 검토 정보</div><div class="info-rows">' +
      (app['지도승인여부']   ? ir('1차(지도) 승인 결과', escapeHtml(app['지도승인여부']))   : '') +
      (app['지도승인의견']   ? ir('1차(지도) ' + (_s1==='반려' ? '반려 사유' : '승인 의견'), escapeHtml(app['지도승인의견']))   : '') +
      (app['도구장비_적절성'] ? ir('1차 검토 — 도구·장비·시약·재료 적절', escapeHtml(app['도구장비_적절성'])) : '') +
      (app['실험내용_적절성'] ? ir('1차 검토 — 실험과정·뒷정리·주의사항 적절', escapeHtml(app['실험내용_적절성'])) : '') +
      (app['최종승인여부']   ? ir('최종 승인 결과', escapeHtml(app['최종승인여부']))   : '') +
      (app['최종승인의견']   ? ir('최종 ' + (_sf==='반려' ? '반려 사유' : '승인 의견'), escapeHtml(app['최종승인의견']))   : '') +
    '</div></div>';
  }

  var companions = app['동반자명단'] || '';
  if (companions) {
    h += '<div class="section"><div class="section-title">동반 학생</div><div class="companion-list">';
    String(companions).split(',').forEach(function(c) {
      c = c.trim();
      if (c) h += '<div class="companion-chip">' + escapeHtml(c) + '</div>';
    });
    h += '</div></div>';
  }

  if (app['실험준비물'] || app['실험과정'] || app['실험뒷정리'] || app['실험시 주의사항']) {
    h += '<div class="section">';
    if (app['실험준비물']) h += '<div class="section-title">실험 준비물</div><p style="font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:16px;">' + escapeHtml(app['실험준비물']) + '</p>';
    if (app['실험과정']) h += '<div class="section-title">실험 과정</div><p style="font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:16px;">' + escapeHtml(app['실험과정']) + '</p>';
    if (app['실험뒷정리']) h += '<div class="section-title">실험 뒷정리</div><p style="font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:16px;">' + escapeHtml(app['실험뒷정리']) + '</p>';
    if (app['실험시 주의사항']) h += '<div class="section-title">실험 시 주의사항</div><p style="font-size:14px;line-height:1.6;color:var(--text-muted);">' + escapeHtml(app['실험시 주의사항']) + '</p>';
    h += '</div>';
  }

  // [v2] 신규 양식(IT/가정/공학) 전용 섹션 — 1·2층 신청은 빈 문자열 반환
  h += mCategorySectionsHtml(app);

  // 📨 메일 재발송 — 승인자가 자동 메일을 받지 못했을 때 관리자가 수동 재발송
  var isNew_m = isNewLabApp(app);
  var teacherEmail_m = String(app['지도교사이메일'] || '').trim();
  var teacherBtn_m = isNew_m
    ? '<button class="action-btn" style="background:#e2e8f0;color:#94a3b8;cursor:not-allowed;" disabled>🔁 지도교사 1차 (해당 없음)</button>'
    : (teacherEmail_m
        ? '<button class="action-btn" style="background:#dbeafe;color:#1e40af;" onclick="m_resendApprovalMail(\'' + encodeURIComponent(app['신청ID']) + '\', \'teacher\')">🔁 지도교사 1차 메일 재발송</button>'
        : '<button class="action-btn" style="background:#fee2e2;color:#991b1b;" onclick="alert(\'⚠️ 이 신청에는 지도교사 이메일이 기록되어 있지 않습니다.\')">⚠ 지도교사 이메일 없음</button>');
  // [v4.18/S8] 실습실(신규 양식) 승인자 = 지도교사
  // [v4.18/S9] 이메일이 비어 있어도 지도교사 이름이 있으면 서버가 교사 명단에서 조회
  var teacherName_m = String(app['지도교사이름'] || '').trim();
  var finalBtn_m = (isNew_m && !teacherEmail_m && !teacherName_m)
    ? '<button class="action-btn" style="background:#fee2e2;color:#991b1b;cursor:not-allowed;" disabled>⚠ 지도교사 미지정</button>'
    : '<button class="action-btn" style="background:#dcfce7;color:#166534;" onclick="m_resendApprovalMail(\'' + encodeURIComponent(app['신청ID']) + '\', \'final\')">🔁 ' + (isNew_m ? '지도교사(단일 승인)' : '최종 승인자(담당교사)') + ' 메일 재발송</button>';
  // [v4.18/S8] 단일 양식 전용: 실습실 담당 선생님 안내 메일 (승인 권한 없음, 정보 전달용)
  var infoBtn_m = '';
  if (isNew_m) {
    infoBtn_m = '<button class="action-btn" style="background:#fef3c7;color:#92400e;" onclick="m_resendApprovalMail(\'' + encodeURIComponent(app['신청ID']) + '\', \'info\')">📨 실습실 담당 선생님 안내 메일</button>';
  }
  h += '<div class="section">' +
       '<div class="section-title">📨 메일 재발송</div>' +
       '<p style="font-size:12px;line-height:1.55;color:var(--text-muted);margin:0 0 10px;">승인자가 자동 발송 메일을 받지 못했을 때 동일한 본문·승인 링크로 재발송합니다.' +
       (isNew_m ? ' 실습실 신청은 지도교사가 승인하며, 실습실 담당 선생님께는 안내 메일을 보낼 수 있습니다 (승인 권한 없음).' : '') +
       '</p>' +
       '<div style="display:flex;flex-direction:column;gap:8px;">' + teacherBtn_m + finalBtn_m + infoBtn_m + '</div>' +
       '</div>';

  body.innerHTML = h;
  // [v2] 시약 섹션은 1·2층 양식만 — 신규 양식은 호출 자체를 생략하여 불필요 네트워크 차단
  if (hasChemSection(app)) loadChemicals(id);

  // 하단 액션 — 목업과 동일
  var btm = $('#detail-bottom');
  if (status === '대기') {

/**

function m_resendApprovalMail(appIdEnc, kind) {
  var appId = decodeURIComponent(String(appIdEnc || ''));
  var app = ALL.find(function(a) { return String(a['신청ID']) === String(appId); });
  if (!app) { alert('신청 정보를 찾을 수 없습니다.'); return; }

  var isNew = isNewLabApp(app);
  var recipientDesc = '';

  // [v4.18/S8] 실습실(신규 양식) 승인자 = 지도교사. 'info'는 실습실 담당 선생님 안내로 전환.
  if (kind === 'teacher' || kind === 'final') {
    // [v4.18/S9] 이메일이 비어 있어도 지도교사 '이름'이 있으면 서버가 교사 명단에서 조회
    if ((isNew || kind === 'teacher') && !app['지도교사이메일'] && !app['지도교사이름']) {
      alert('⚠️ 이 신청에는 지도교사 정보(이름·이메일)가 모두 없습니다.\n\n신청서를 수정해 지도교사를 지정한 뒤 다시 시도해 주세요.');
      return;
    }
    var emailDesc = app['지도교사이메일'] || '이메일 비어 있음 → 교사 명단에서 조회';
    if (isNew) {
      recipientDesc = '지도교사 ' + (app['지도교사이름'] || '?') + ' <' + emailDesc + '> (실습실 단일 승인)';
    } else if (kind === 'teacher') {
      recipientDesc = '지도교사 ' + (app['지도교사이름'] || '?') + ' <' + emailDesc + '>';
    } else {
      recipientDesc = '실험실 담당교사 (' + (app['신청실험실'] || '') + ')';
    }
  } else if (kind === 'info') {
    if (!isNew) {
      alert('⚠️ 실습실 담당 선생님 안내 메일은 단일 승인 양식(IT/가정/공학)에서만 사용됩니다.\n\n1·2층 양식은 실험실 담당교사가 최종 승인자이므로 별도 안내가 필요 없습니다.');
      return;
    }
    recipientDesc = '실습실 담당 선생님 (' + (app['사용실험실목록'] || app['신청실험실'] || '') + ') — 안내용, 승인 권한 없음';
  } else {
    alert('알 수 없는 발송 종류: ' + kind);
    return;
  }

  var stageLabel = (kind === 'teacher') ? (isNew ? '지도교사 (실습실 단일 승인)' : '1차 승인 (지도교사)')
                : (kind === 'final')   ? (isNew ? '지도교사 (실습실 단일 승인)' : '최종 승인 (담당교사)')
                :                        '실습실 담당 선생님 안내';
  var confirmMsg =
    '다음 대상에게 메일을 재발송할까요?\n\n' +
    '• 단계: ' + stageLabel + '\n' +
    '• 대상: ' + recipientDesc + '\n' +
    '• 신청 ID: ' + appId + '\n' +
    '• 대표자: ' + (app['대표자이름'] || '') + ' (' + (app['대표자학번'] || '') + ')\n\n' +
    '자동 발송과 동일한 본문·승인 링크로 다시 발송됩니다.';

  if (!confirm(confirmMsg)) return;

  // 발송 중 — 상세 패널 안의 버튼들을 비활성화
  var btns = document.querySelectorAll('#detail-panel button');
  var prev = [];
  btns.forEach(function(b) { prev.push(b.disabled); b.disabled = true; });
  var restore = function() { btns.forEach(function(b, i) { b.disabled = prev[i]; }); };

  google.script.run
    .withSuccessHandler(function(res) {
      restore();
      if (res && res.ok) {
        alert('✅ 메일 발송 성공\n\n• 대상: ' + (res.recipient || recipientDesc));
      } else {
        alert('❌ 메일 발송 실패\n\n' + ((res && res.error) || '알 수 없는 오류'));
      }
    })
    .withFailureHandler(function(err) {
      restore();
      alert('❌ 메일 발송 중 오류\n\n' + ((err && err.message) || err));
    })
    .resendApprovalRequestEmail(appId, kind);
}

/* [MR28] 상세 패널 포커스 트랩 (Tab 키가 배경으로 못 빠져나가게) */
var _detailOpenerEl = null;
var _detailTrapHandler = null;
function _attachFocusTrap_() {
  _detachFocusTrap_();
  var panel = document.getElementById('detail-panel');
  if (!panel) return;
  _detailTrapHandler = function(e) {
    if (e.key !== 'Tab') return;
    if (!panel.classList.contains('show')) return;
    var focusables = panel.querySelectorAll(
      'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
    );
    if (focusables.length === 0) return;
    var first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  };
  document.addEventListener('keydown', _detailTrapHandler, true);
}
function _detachFocusTrap_() {
  if (_detailTrapHandler) {
    document.removeEventListener('keydown', _detailTrapHandler, true);
    _detailTrapHandler = null;
  }
}

// [C8] 재클릭 가드 — confirm 여러 번 통과해도 서버로 두 번 안 보냄
var APPROVING = false;

// [MR16] 반려 시 사유 입력 — 기존 1차/최종 승인 상태로 어느 의견 컬럼에 쓸지 결정
function determineRejectCommentField_(app) {
  // 1차 미처리 → 1차 반려 → '지도승인의견'에 기록
  // 1차 승인 완료 후 반려 → '최종승인의견'에 기록
  // [v4.18/S6] 신규 양식(단일 승인)은 항상 최종 단계 → '최종승인의견'
  if (app && typeof isNewLabApp === 'function' && isNewLabApp(app)) return '최종승인의견';
  var first = String((app && app['지도승인여부']) || '').trim();
  return first === '승인' ? '최종승인의견' : '지도승인의견';
}

function approveAction(newStatus) {
  if (APPROVING) return;           // 이미 진행 중
  if (!CURRENT_DETAIL) return;
  var name = CURRENT_DETAIL['대표자이름'] || '';

  // [E1] 신규 양식 단일 승인 흐름 보존을 위해 CURRENT_DETAIL(현재 신청 객체) 전달
  var approvals = mapStatusToApprovals(newStatus, CURRENT_DETAIL);

  // [MR16] 반려는 사유 입력을 강제
  if (newStatus === '반려') {
    var reason = prompt(name + ' 학생의 신청을 반려하려면 사유를 입력하세요.\n(학생에게 안내됩니다)');
    if (reason === null) return; // 취소
    reason = String(reason).trim();
    if (!reason) { alert('반려 사유를 입력해야 합니다.'); return; }
    var commentField = determineRejectCommentField_(CURRENT_DETAIL);
    approvals[commentField] = reason;
  } else {
    if (!confirm(name + ' 학생의 신청을 "' + newStatus + '"(으)로 변경하시겠습니까?')) return;
  }

  APPROVING = true;
  if (typeof showGlobalBusy === 'function') showGlobalBusy('처리 중입니다');
  google.script.run
    .withSuccessHandler(function(res) {
      APPROVING = false;
      // [v4.18/S1] 서버는 오류를 throw 대신 {success:false, message} 로 반환 —
      //   실패도 "저장되었습니다"로 표시되던 문제. 반환값 확인 후 분기.
      if (res && res.success === false) {
        var failMsg = res.message || '처리에 실패했습니다. 다시 시도해 주세요.';
        if (typeof showGlobalError === 'function') showGlobalError('처리 실패', failMsg);
        else alert('처리 실패: ' + failMsg);
        return;
      }
      closeDetail();
      loadApplications();
      if (typeof showGlobalSuccess === 'function') {
        showGlobalSuccess('저장되었습니다', newStatus + ' 처리가 완료되었습니다.');
      } else {
        alert(newStatus + ' 처리되었습니다.');
      }
    })
    .withFailureHandler(function(err) {
      APPROVING = false;
      var msg = (err && (err.message || err)) || '알 수 없는 오류';
      if (typeof showGlobalError === 'function') {
        showGlobalError('처리 실패', msg);
      } else {
        alert('처리 실패: ' + msg);
      }
    })
    .updateApplicationFields(CURRENT_DETAIL['신청ID'], approvals);
}

function quickApprove(appId) {

function escapeCSV(val) { var s = String(val==null?'':val); return (s.includes(',')||s.includes('"')||s.includes('\n')) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCSV() {

  var rows = [h.join(',')];

  });
  var blob = new Blob(['\uFEFF'+rows.join('\n')], {type:'text/csv;charset=utf-8;'});

  if (!confirm(name + ' 학생의 신청서를 삭제할까요?\n연결된 시약 기록도 함께 삭제됩니다.')) return;

  if (typeof showGlobalBusy === 'function') showGlobalBusy('삭제 중입니다');
  google.script.run
    .withSuccessHandler(function(r) {
      if (r && r.success === false) {
        if (typeof showGlobalError === 'function') showGlobalError('삭제 실패', r.message || '알 수 없는 오류');
        else alert('삭제 실패: ' + (r.message || ''));
        return;
      }
      closeDetail();
      loadApplications();
      if (typeof showGlobalSuccess === 'function') showGlobalSuccess('삭제되었습니다', '신청서가 삭제되었습니다.');
      else alert('삭제되었습니다.');
    })
    .withFailureHandler(function(err) {
      var msg = (err && (err.message||err)) || '알 수 없는 오류';
      if (typeof showGlobalError === 'function') showGlobalError('삭제 실패', msg);
      else alert('삭제 실패: ' + msg);
    })
    .deleteApplication(id);
}

function mSwipeReject(id) {

}

/* ---- 지도 통계 ---- */
function openWarningStats() {
  var panel = mEnsureTopLevel_('m-warningModal');
  if (!panel) return;
  panel.style.display = '';
  panel.classList.add('show');
  mPanelOpenPush_('m-warningModal'); // [v4.18/S6] 뒤로가기 연동
  var body = document.getElementById('m-warningBody');
  body.innerHTML = '<div class="m-loading"><div class="m-loading-spinner"></div>로딩 중...</div>';
  google.script.run
    .withSuccessHandler(function(arr) {
      if (!Array.isArray(arr) || arr.length === 0) {
        body.innerHTML = '<div class="m-empty"><div>통계 데이터가 없습니다.</div></div>';
        return;
      }
      var rows = arr.map(function(r) {
        return '<tr><td>'+escapeHtml(r['학번']||'')+'</td><td>'+escapeHtml(r['이름']||'')+'</td>'
          +'<td>'+escapeHtml(r['지도']||0)+'</td><td>'+escapeHtml(r['경고']||0)+'</td>'
          +'<td>'+escapeHtml(r['안전사고']||0)+'</td><td>'+escapeHtml(r['기타 특이사항']||0)+'</td><td><b>'+escapeHtml(r['total']||0)+'</b></td></tr>';
      }).join('');
      // [v4.18/S6] '기타' 열 추가 — 행 합계와 총계가 안 맞아 보이던 문제 (칭찬·기타가 총계에만 포함됐음)
      body.innerHTML = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">'
        +'<table style="width:100%;border-collapse:collapse;font-size:13px;">'
        +'<thead><tr style="background:var(--primary-light);"><th style="padding:10px 8px;">학번</th><th style="padding:10px 8px;">이름</th><th style="padding:10px 8px;">지도</th><th style="padding:10px 8px;">경고</th><th style="padding:10px 8px;">안전사고</th><th style="padding:10px 8px;">기타</th><th style="padding:10px 8px;">총계</th></tr></thead>'
        +'<tbody>'+rows+'</tbody></table></div>';
      // 테이블 셀 스타일
      body.querySelectorAll('td,th').forEach(function(c){ c.style.textAlign='center'; c.style.borderBottom='1px solid var(--border)'; });
    })
    .withFailureHandler(function(err) {
      body.innerHTML = '<div class="m-empty"><div>통계 조회 실패: '+(err&&(err.message||err)||'')+'</div></div>';
    })
    .warningStatsByStudent();
}
function mCloseWarningStats() {
  var panel = document.getElementById('m-warningModal');
  if (panel) { panel.classList.remove('show'); panel.style.display = 'none'; }
  mPanelClosed_('m-warningModal');
}

/* ---- [v4.18/S2] 제한 정책 설정 (모바일) ---- */
function mShowPolicyPanel() {
  var p = document.getElementById('m-policyPanel');
  var box = document.getElementById('m-restrictionResult');
  if (!p) return;
  if (p.style.display !== 'none') { p.style.display = 'none'; return; }
  p.style.display = '';
  if (box) box.innerHTML = '';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res) return;
      var en = document.getElementById('mp_enabled');
      var cn = document.getElementById('mp_count');
      var dy = document.getElementById('mp_days');
      if (en) en.checked = !!res.enabled;
      if (cn) cn.value = res.count || 2;
      if (dy) dy.value = res.days || 30;
    })
    .withFailureHandler(function(err) {
      if (typeof showGlobalError === 'function') showGlobalError('정책 조회 실패', (err && (err.message||err)) || '');
    })
    .getRestrictionPolicy();
}
function mSavePolicyMobile() {
  var payload = {
    enabled: !!(document.getElementById('mp_enabled')||{}).checked,
    count: parseInt((document.getElementById('mp_count')||{}).value || '2', 10),
    days:  parseInt((document.getElementById('mp_days')||{}).value  || '30', 10)
  };
  if (typeof showGlobalBusy === 'function') showGlobalBusy('정책 저장 중입니다');
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success === false) {
        if (typeof showGlobalError === 'function') showGlobalError('정책 저장 실패', res.message || res.error || '잠시 후 다시 시도해 주세요.');
        else alert('저장 실패');
        return;
      }
      if (typeof showGlobalSuccess === 'function') showGlobalSuccess('저장되었습니다', '제한 정책이 저장되었습니다.');
      else alert('저장되었습니다.');
    })
    .withFailureHandler(function(err) {
      var msg = (err && (err.message||err)) || '알 수 없는 오류';
      if (typeof showGlobalError === 'function') showGlobalError('정책 저장 실패', msg);
      else alert('저장 실패: ' + msg);
    })
    .saveRestrictionPolicy(payload);
}
